services:
  - type: web
    name: cw-shadow
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn app:app
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: CW_ADMIN_PASS
        value: cwtools2026
      - key: PYTHON_VERSION
        value: 3.11.9
